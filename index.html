```html
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coin Clicker</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#111827,#312e81);
  color:white;
  text-align:center;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:25px 15px 50px;
}

h1{
  margin:5px 0 15px;
  font-size:32px;
}

button{
  border:0;
  border-radius:9px;
  padding:9px 13px;
  background:#4f46e5;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  filter:brightness(1.15);
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.controls{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:10px;
}

.hotkeys{
  max-width:650px;
  margin:10px auto;
  padding:10px;
  background:#ffffff12;
  border-radius:12px;
}

.monday{
  max-width:650px;
  margin:10px auto;
  padding:10px;
  border-radius:12px;
  background:#f59e0b33;
  border:1px solid #facc15;
  font-weight:bold;
}

.rebirthBox{
  max-width:650px;
  margin:12px auto;
  padding:14px;
  border-radius:14px;
  background:linear-gradient(135deg,#7c3aed33,#ec489933);
  border:1px solid #ffffff30;
}

.rebirthBox button{
  margin-top:8px;
  background:#b026ff;
}

.coinArea{
  margin:20px auto;
}

.coin{
  width:170px;
  height:170px;
  border-radius:50%;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:70px;
  background:linear-gradient(145deg,#ffe066,#d99a00);
  border:9px solid #fff1a8;
  box-shadow:0 8px 30px #0009;
  cursor:pointer;
  user-select:none;
  transition:.1s;
}

.coin:active{
  transform:scale(.86);
}

.pop{
  animation:pop .25s;
}

@keyframes pop{
  40%{transform:scale(1.15)}
  70%{transform:scale(.95)}
}

.stats{
  max-width:650px;
  margin:15px auto;
  padding:15px;
  background:#ffffff12;
  border:1px solid #ffffff25;
  border-radius:15px;
}

.statrow{
  display:flex;
  justify-content:space-between;
  padding:5px 0;
}

.section{
  max-width:850px;
  margin:18px auto;
  padding:15px;
  background:#ffffff12;
  border:1px solid #ffffff25;
  border-radius:15px;
}

.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:10px;
  margin:7px 0;
  background:#0004;
  border-radius:10px;
  text-align:left;
}

.item button{
  margin-left:4px;
}

.pets{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;
}

.pet{
  background:#0004;
  border-radius:12px;
  padding:10px;
}

.petIcon{
  font-size:40px;
}

.owned{
  outline:2px solid #60a5fa;
}

.limitedPet{
  border:2px solid #ec4899;
  background:linear-gradient(135deg,#ec489922,#8b5cf622);
}

.timer{
  color:#fb7185;
  font-size:11px;
  font-weight:bold;
}

.float{
  position:fixed;
  pointer-events:none;
  font-size:21px;
  font-weight:bold;
  animation:floatUp .8s forwards;
  z-index:20;
}

@keyframes floatUp{
  to{
    opacity:0;
    transform:translateY(-75px) scale(1.2);
  }
}

.bad{
  background:#dc2626!important;
  animation:shake .4s;
}

@keyframes shake{
  25%{transform:translateX(-6px)}
  50%{transform:translateX(6px)}
  75%{transform:translateX(-6px)}
}

.emailBox{
  max-width:650px;
  margin:15px auto;
  padding:15px;
  background:#ffffff12;
  border-radius:15px;
}

.emailBox a{
  display:inline-block;
  padding:9px 14px;
  border-radius:9px;
  background:#4f46e5;
  color:white;
  text-decoration:none;
  font-weight:bold;
}

.muted{
  opacity:.7;
  font-size:12px;
}

@media(max-width:600px){
  .item{
    flex-direction:column;
    align-items:flex-start;
  }

  .coin{
    width:145px;
    height:145px;
    font-size:60px;
  }
}
</style>
</head>

<body>

<div class="wrap">

<h1>🪙 COIN CLICKER</h1>

<div class="controls">
<button id="soundBtn">🔊 Sounds: ON</button>
<button id="resetBtn">♻️ Reset Game</button>
</div>

<div class="hotkeys">

</div>

<div class="monday">
⚡ PLAY ON MONDAY FOR 3X CLICKS! ⚡
</div>

<div class="rebirthBox">
