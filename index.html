<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mega Clicker 2.0</title><style>
body{font-family:Arial;background:linear-gradient(135deg,#111827,#312e81);color:#fff;text-align:center;padding:20px}.top{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}.stats,.section{background:#ffffff12;border:1px solid #ffffff25;border-radius:15px;padding:15px}.stats{text-align:left;min-width:200px}.statrow{display:flex;justify-content:space-between;margin:5px}.coin{width:150px;height:150px;border-radius:50%;margin:25px auto 10px;display:flex;align-items:center;justify-content:center;font-size:60px;background:linear-gradient(145deg,#ffe066,#d99a00);border:8px solid #fff1a8;box-shadow:0 8px 25px #0008;cursor:pointer;transition:.1s}.coin:active{transform:scale(.87)}.pop{animation:pop .28s}@keyframes pop{35%{transform:scale(1.18) rotate(-4deg)}70%{transform:scale(.94) rotate(4deg)}}.float{position:absolute;pointer-events:none;font-weight:bold;font-size:20px;animation:up .8s forwards}@keyframes up{to{opacity:0;transform:translateY(-75px) scale(1.2)}}.section{max-width:850px;margin:20px auto}.item{display:flex;justify-content:space-between;align-items:center;background:#0003;padding:10px;margin:7px;border-radius:10px;text-align:left}button{background:#4f46e5;color:#fff;border:0;border-radius:9px;padding:9px 13px;font-weight:bold;cursor:pointer}button.bad{background:#d62828!important;animation:shake .55s}@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}.pets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.pet{background:#0003;border-radius:12px;padding:12px}.owned{outline:2px solid #60a5fa}.petIcon{font-size:42px}.pet button{width:100%;margin-top:8px}.muted{font-size:12px;opacity:.75}.msg{min-height:25px;font-weight:bold}
</style></head><body><h1>🪙 MEGA CLICKER 2.0</h1><div class="top"><div><div>Level <b id="level">1</b> • XP <b id="xp">0</b>/<b id="next">100</b></div><div id="coin" class="coin">🪙</div><div id="msg" class="msg">Click the coin!</div><div>🪙 <b id="coins">0</b> 💎 <b id="gems">0</b> 🔮 <b id="crystals">0</b> 🌌 <b id="stars">0</b></div><div class="muted">Power <b id="power">1</b> • CPS <b id="cps">0</b></div></div><div class="stats"><h3>📊 Click Stats</h3><div class="statrow">Total clicks <b id="clicks">0</b></div><div class="statrow">Normal <b id="normal">0</b></div><div class="statrow">🥉 Bronze <b id="bronze">0</b></div><div class="statrow">🥈 Silver <b id="silver">0</b></div><div class="statrow">🥇 Gold <b id="gold">0</b></div><div class="statrow">🚀 Space <b id="space">0</b></div><div class="statrow">🌌 Cosmic <b id="cosmic">0</b></div></div></div><div class="section"><h2>🛒 Upgrades</h2><div id="shop"></div></div><div class="section"><h2>🐾 Pets</h2><div class="muted">Pets boost your clicks.</div><div id="pets" class="pets"></div></div>
<script>
const s={coins:0,gems:0,crystals:0,stars:0,power:1,cps:0,gps:0,crystalps:0,starps:0,xp:0,level:1,clicks:0,normal:0,bronze:0,silver:0,gold:0,space:0,cosmic:0,pet:1},U=[["💪 Stronger Finger","coins",25,"power",1],["🤖 Coin Bot","coins",75,"cps",1],["🔥 Golden Finger","coins",500,"power",5],["🏭 Coin Factory","coins",2500,"cps",10],["⚡ Turbo Factory","coins",10000,"cps",50],["👆 Double Tap","coins",50000,"mul",2],["💎 Gem Generator","gems",10,"gps",1],["💎 Gem Booster","gems",50,"power",25],["🔮 Crystal Mine","gems",250,"crystalps",1],["🌌 Star Engine","crystals",25,"starps",1]],C=U.map(x=>x[2]),P=[["🐶","Coin Pup",1000,1.25],["🐱","Gem Cat",5000,1.5],["🐲","Dragon",50000,2],["🦄","Cosmic Unicorn",500000,4]],owned=[];
const f=n=>Math.floor(n).toLocaleString(),xp=n=>{s.xp+=n;while(s.xp>=s.level*100){s.xp-=s.level*100;s.level++}};
function rare(){let r=Math.random();if(r<.002&&s.level>=30)return["cosmic",1000,"🌌 COSMIC CLICK!"];if(r<.01&&s.level>=20)return["space",50,"🚀 SPACE CLICK!"];if(r<.04&&s.level>=10)return["gold",15,"🥇 GOLD CLICK!"];if(r<.1&&s.level>=5)return["silver",5,"🥈 SILVER CLICK!"];if(r<.22)return["bronze",2,"🥉 BRONZE CLICK!"];return["normal",1,"Normal Click!"]}
function bad(b,t){b.classList.remove("bad");void b.offsetWidth;b.classList.add("bad");document.getElementById("msg").textContent="❌ "+t;setTimeout(()=>b.classList.remove("bad"),650)}
function render(){["coins","gems","crystals","stars","power","cps","clicks","normal","bronze","silver","gold","space","cosmic","level","xp"].forEach(k=>document.getElementById(k).textContent=f(s[k]));document.getElementById("next").textContent=f(s.level*100);document.getElementById("shop").innerHTML=U.map((u,i)=>`<div class="item"><span>${u[0]} <b>${u[1]}</b><br><span class="muted">Cost: ${f(C[i])} ${u[1]}</span></span><button data-u="${i}">BUY</button></div>`).join("");document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>buy(+b.dataset.u));document.getElementById("pets").innerHTML=P.map((p,i)=>`<div class="pet ${owned.includes(i)?"owned":""}"><div class="petIcon">${p[0]}</div><b>${p[1]}</b><div>🪙 ${f(p[2])}</div><button data-p="${i}" ${owned.includes(i)?"disabled":""}>${owned.includes(i)?"OWNED":"GET PET"}</button></div>`).join("");document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>pet(+b.dataset.p))}
function buy(i){let u=U[i],b=document.querySelector(`[data-u="${i}"]`);if(s[u[1]]<C[i])return bad(b,"Not enough "+u[1]+"!");s[u[1]]-=C[i];u[3]=="mul"?s.power*=u[4]:s[u[3]]+=u[4];C[i]=Math.ceil(C[i]*1.72);render()}
function pet(i){let p=P[i],b=document.querySelector(`[data-p="${i}"]`);if(s.coins<p[2])return bad(b,"Not enough coins!");s.coins-=p[2];owned.push(i);s.pet=Math.max(...owned.map(x=>P[x][3]));render()}
document.getElementById("coin").onclick=e=>{let [k,m,msg]=rare(),g=s.power*m*s.pet;s.coins+=g;s.clicks++;s[k]++;xp(Math.max(1,Math.floor(g/2)));let c=document.getElementById("coin");c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop");document.getElementById("msg").textContent=msg+" +"+f(g)+" 🪙";let q=document.createElement("span");q.className="float";q.textContent="+"+f(g);q.style.left=e.offsetX+"px";q.style.top=e.offsetY+"px";document.body.appendChild(q);setTimeout(()=>q.remove(),850);render()};
setInterval(()=>{s.coins+=s.cps*s.pet;if(s.level>=5)s.gems+=s.gps;if(s.level>=15)s.crystals+=s.crystalps;if(s.level>=30)s.stars+=s.starps;xp(Math.floor(s.cps/2));render()},1000);render();
</script></body></html>
