<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mega Clicker</title>
<style>body{margin:0;background:#10182e;color:white;font-family:Arial;text-align:center}.wrap{max-width:900px;margin:auto;padding:20px}.box{background:#192544;border-radius:18px;padding:18px;margin:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#0e1629;padding:10px;border-radius:10px}.stat b{display:block;font-size:20px}.coin{width:210px;height:210px;border-radius:50%;border:8px solid #c98b12;background:#ffd83d;font-size:80px;cursor:pointer;margin:20px}.coin.pop{transform:scale(.9)}button{padding:10px;margin:4px;border:0;border-radius:9px;background:#4169e1;color:white;font-weight:bold;cursor:pointer}.item{display:flex;justify-content:space-between;background:#0e1629;padding:10px;margin:7px;border-radius:10px}.muted{color:#aebbd8}.float{position:fixed;color:#ffe15c;font-size:22px;font-weight:bold;pointer-events:none;animation:f .8s forwards}@keyframes f{to{opacity:0;transform:translateY(-60px)}}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}</style></head>
<body><div class="wrap"><h1>🪙 MEGA CLICKER</h1><p class="muted">Click the coin or press SPACE / an arrow key!</p>
<div class="box"><div class="stats"><div class="stat">Coins<b id="coins">0</b></div><div class="stat">Gems<b id="gems">0</b></div><div class="stat">Crystals<b id="crystals">0</b></div><div class="stat">Stars<b id="stars">0</b></div><div class="stat">Power<b id="power">1</b></div><div class="stat">Per Second<b id="cps">0</b></div><div class="stat">Clicks<b id="clicks">0</b></div><div class="stat">Level<b id="level">1</b></div></div>
<button class="coin" id="coin">🪙</button><div id="msg">Ready!</div><button id="sound">🔊 Sound ON</button><button id="music">🎵 Music OFF</button><button id="save">💾 Save</button><button id="reset">♻️ Reset</button></div>
<div class="box"><h2>🚀 Upgrades</h2><div id="shop"></div></div><div class="box"><h2>🐾 Pets</h2><div id="pets"></div></div></div>
<script>
'use strict';
const base={coins:0,gems:0,crystals:0,stars:0,power:1,clicks:0,level:1,xp:0,counts:[],pets:[],pet:1};
let s={...base},cost=[25,100,500,10,25,10,5000,25000],soundOn=true,musicOn=false,audio=null,musicTimer=null;
const U=[['🖱️ Stronger Click','coins',25,1,'power'],['🤖 Coin Bot','coins',100,1,'cps'],['⚡ Super Bot','coins',500,5,'cps'],['💎 Gem Finder','gems',10,1,'gems'],['🔮 Crystal Drill','crystals',25,1,'crystals'],['🌟 Star Factory','stars',10,1,'stars'],['🚀 Mega Engine','coins',5000,5,'power'],['🌌 Cosmic Engine','coins',25000,25,'cps']];
const P=[['🐶','Coin Pup',100,1.15],['🐱','Gem Cat',500,1.35],['🐲','Dragon',2500,1.8],['👽','Alien',10000,2.5]];
const $=id=>document.getElementById(id),fmt=n=>Math.floor(n||0).toLocaleString();
function saveGame(){try{localStorage.setItem('megaClicker',JSON.stringify({s,cost}))}catch(e){}}
function loadGame(){try{let x=JSON.parse(localStorage.getItem('megaClicker'));if(x){s={...base,...x.s};cost=x.cost||cost}}catch(e){}}
function audioOK(){try{let C=window.AudioContext||window.webkitAudioContext;if(!C)return null;if(!audio)audio=new C;if(audio.state==='suspended')audio.resume().catch(()=>{});return audio}catch(e){return null}}
function beep(freq=500,d=.06){if(!soundOn)return;try{let a=audioOK();if(!a)return;let o=a.createOscillator(),g=a.createGain();o.frequency.value=freq;g.gain.setValueAtTime(.025,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
function render(){
$('coins').textContent=fmt(s.coins);$('gems').textContent=fmt(s.gems);$('crystals').textContent=fmt(s.crystals);$('stars').textContent=fmt(s.stars);$('power').textContent=fmt(s.power);$('clicks').textContent=fmt(s.clicks);$('level').textContent=fmt(s.level);
let cps=U.reduce((a,u,i)=>a+(u[4]==='cps'?(s.counts[i]||0)*u[3]:0),0);$('cps').textContent=fmt(cps);
$('shop').innerHTML=U.map((u,i)=>`<div class="item"><span>${u[0]}<br><small>Cost: ${fmt(cost[i])} ${u[1]} • Owned: ${s.counts[i]||0}</small></span><button data-u="${i}">BUY</button></div>`).join('');
document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>buy(+b.dataset.u));
$('pets').innerHTML=P.map((p,i)=>`<div class="item"><span>${p[0]} ${p[1]} — 🪙${fmt(p[2])} — ×${p[3]}</span><button data-p="${i}" ${(s.pets||[]).includes(i)?'disabled':''}>${(s.pets||[]).includes(i)?'OWNED':'GET PET'}</button></div>`).join('');
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>buyPet(+b.dataset.p));
}
function xp(n){s.xp+=n;while(s.xp>=s.level*100){s.xp-=s.level*100;s.level++;s.power++;$('msg').textContent='🎉 LEVEL UP! +1 Power!'}}
function tap(e){
let r=Math.random(),m=1,k='coins',msg='Nice!';if(r<.015){m=25;k='stars';msg='🌟 STAR CLICK!'}else if(r<.05){m=10;k='crystals';msg='🔮 CRYSTAL CLICK!'}else if(r<.15){m=3;k='gems';msg='💎 GEM CLICK!'}
let gain=s.power*s.pet*m;s.coins+=gain;s.clicks++;s[k]++;xp(Math.max(1,Math.floor(gain/2)));$('msg').textContent=msg+' +'+fmt(gain)+' 🪙';
let c=$('coin');c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop');let q=document.createElement('span');q.className='float';q.textContent='+'+fmt(gain);q.style.left=(e?.clientX||innerWidth/2)+'px';q.style.top=(e?.clientY||250)+'px';document.body.appendChild(q);setTimeout(()=>q.remove(),800);
render();beep(m>1?900:520);save();
}
function buy(i){let u=U[i];if((s[u[1]]||0)<cost[i]){$('msg').textContent='❌ Not enough '+u[1]+'!';return}s[u[1]]-=cost[i];if(u[4]==='power')s.power+=u[3];else if(u[4]!=='cps')s[u[4]]=(s[u[4]]||0)+u[3];s.counts[i]=(s.counts[i]||0)+1;cost[i]=Math.ceil(cost[i]*1.7);$('msg').textContent='🚀 Upgrade purchased!';render();beep(700);save()}
function buyPet(i){let p=P[i];if((s.pets||[]).includes(i))return;if(s.coins<p[2]){$('msg').textContent='❌ Not enough coins!';return}s.coins-=p[2];s.pets.push(i);s.pet=Math.max(s.pet,p[3]);$('msg').textContent=p[0]+' '+p[1]+' joined you!';render();beep(800);save()}
$('coin').onclick=tap;document.onkeydown=e=>{if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();tap()}};
$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 Sound ON':'🔇 Sound OFF';if(soundOn)beep()};
$('music').onclick=()=>{musicOn=!musicOn;$('music').textContent=musicOn?'🎵 Music ON':'🎵 Music OFF';clearInterval(musicTimer);if(musicOn){let n=[196,220,262,330,262,220,174,220],i=0;musicTimer=setInterval(()=>{let old=soundOn;soundOn=true;beep(n[i++%n.length],.25);soundOn=old},450)}};
$('save').onclick=()=>{saveGame();$('msg').textContent='💾 Game saved!'};
$('reset').onclick=()=>{if(confirm('Reset Mega Clicker?')){s={...base,counts:[],pets:[]};cost=[25,100,500,10,25,10,5000,25000];saveGame();render();$('msg').textContent='♻️ Reset!'}};
loadGame();render();setInterval(()=>{let cps=U.reduce((a,u,i)=>a+(u[4]==='cps'?(s.counts[i]||0)*u[3]:0),0);if(cps){s.coins+=cps;render()}},1000);setInterval(saveGame,10000);
</script></body></html>
